<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 通常のタイトル -->
  <title>https://discord.gg/qFQTe7rcyE by Nuked</title>

  <!-- ===== Discord埋め込み用 OGP設定 ===== -->
  <!-- 埋め込みのタイトル(リンクとして表示される部分) -->
  <meta property="og:title" content="https://discord.gg/qFQTe7rcyE by Nuked" />

  <!-- 埋め込みの説明文 -->
  <meta property="og:description" content="Nuked の Discord サーバーへようこそ！" />

  <!-- 埋め込みのURL(Discordでは自動でリンク化されます) -->
  <meta property="og:url" content="https://discord.gg/qFQTe7rcyE" />

  <!-- サイト種別 -->
  <meta property="og:type" content="website" />

  <!-- 埋め込みのサイト名(タイトル上部に小さく表示される) -->
  <meta property="og:site_name" content="Nuked" />

  <!-- 埋め込みのサムネイル画像(任意) -->
  <meta property="og:image" content="https://example.com/nuked-thumbnail.png" />

  <!-- 埋め込みの左側の縦線の色を指定(16進数、#なし) -->
  <meta name="theme-color" content="#5865F2" />

  <!-- Twitterカード(念のため併記) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="https://discord.gg/qFQTe7rcyE by Nuked" />
  <meta name="twitter:description" content="Nuked の Discord サーバーへようこそ！" />
  <meta name="twitter:image" content="https://example.com/nuked-thumbnail.png" />
</head>
<body>
  <h1>Nuked Discord</h1>
  <p>
    <a href="https://discord.gg/qFQTe7rcyE" target="_blank" rel="noopener">
      https://discord.gg/qFQTe7rcyE by Nuked
    </a>
  </p>
</body>
</html>
